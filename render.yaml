services:
  - type: web
    name: devops-ai-chat
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: manus
      - key: AI_MODEL
        value: manus-1.6-lite
      - key: MANUS_BASE_URL
        value: https://api.manus.ai/v1/responses
